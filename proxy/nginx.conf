upstream api {
    ip_hash;
    keepalive 64;
    server ${API_ADDRESS};
}

upstream client {
    keepalive 64;
    server ${UI_ADDRESS};
}

upstream womginx {
    keepalive 64;
    server ${BROWSER_PROXY_ADDRESS};
}

server {
    listen 80;
    listen 443 ssl http2;
    ssl_certificate     /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/certs/server.key;
    merge_slashes off;

    rewrite_log on;
    error_log   /var/log/nginx/error.log debug;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://client;

        # enable WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

    }

    location /api {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_pass http://api;

        # enable WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /tor {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '</head>' '<script>(function(){function f(u){return u.replace(/(\/tor\/https?:\/\/[^\/]+)\/tor\/https?:\/\/[^\/]+/g,function(_,p){return p})}var p=history.pushState,r=history.replaceState;history.pushState=function(s,t,u){if(typeof u==="string")u=f(u);return p.apply(this,[s,t,u])};history.replaceState=function(s,t,u){if(typeof u==="string")u=f(u);return r.apply(this,[s,t,u])};if(location.pathname.match(/(\/tor\/https?:\/\/[^\/]+)\/tor\/https?:\/\/[^\/]+/)){history.replaceState(history.state,document.title,f(location.href));}})();</script></head>';
        proxy_pass http://womginx;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /wombat {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://womginx;
    }

    location = /wombat-handler.js {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://womginx;
    }

    location /womginxaddcookie {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://womginx;
    }

    location /socket.io {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_pass http://api/socket.io/socket.io;

        # enable WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
